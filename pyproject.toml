[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mule-hunt"
version = "0.7.0"
description = "Graph-neural-network fraud detection for UPI-style payment graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soham Jadhav" }]
keywords = ["gnn", "fraud-detection", "upi", "graph-neural-networks", "aml"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
xgb = ["xgboost>=2.0"]

# The synthetic generator (gen-fraud-graph, Apache-2.0) is a git dependency and
# cannot ship in PyPI metadata; install it manually for `upifraud generate`:
#   pip install "gen-fraud-graph @ git+https://github.com/SantanderAI/gen-fraud-graph.git"

[project.scripts]
upifraud = "upifraud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
